# Publishes the MCP Registry entry ai.getmarrow/marrow for a version that is already public on npm.
#
# The signing key MCP_PRIVATE_KEY never reaches a command line. The pinned mcp-publisher takes its key only
# as a --private-key argument, so the login step runs scripts/mcp-registry-dns-login.cjs instead: it reads the
# key from that one step's environment, signs in the process and writes the registry token file (0600). No
# other step holds the key, no step prints it, and nothing is uploaded or cached. The last step deletes the
# token file. test/workflow-secrets.test.js (scripts/workflow-secret-lint.cjs) fails the build if any workflow
# lets a secret into a command, a URL, a log line, an artifact or a cache.
#
# It runs only for a tag mcp-registry-v* or a manual dispatch from master, never for a pull request or a
# fork, and the job refuses a commit that is not on master. The mcp-registry-publish environment should
# also accept only those refs (repository setting, checked by the release owner).
name: Publish MCP Registry Metadata

on:
  workflow_dispatch:
  push:
    tags:
      - 'mcp-registry-v*'

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/mcp-registry-v'))
    runs-on: ubuntu-24.04
    environment: mcp-registry-publish
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit to be on master
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/master \
            || { echo '::error::The commit is not on master.'; exit 1; }

      - name: Set up the pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          package-manager-cache: false

      - name: Verify package is already public
        run: |
          expected="$(node -p "require('./package.json').version")"
          published="$(npm view @getmarrow/mcp version)"
          test "$published" = "$expected"

      - name: Install verified MCP publisher
        env:
          PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            --output /tmp/mcp-publisher.tar.gz
          echo "$PUBLISHER_SHA256  /tmp/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version 2>&1 | grep -F 'mcp-publisher 1.7.9'

      - name: Validate registry metadata
        run: ./mcp-publisher validate

      - name: Authenticate with getmarrow.ai DNS (ai.getmarrow/* namespace)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          set +x
          node scripts/mcp-registry-dns-login.cjs --domain getmarrow.ai

      - name: Publish registry metadata
        run: ./mcp-publisher publish

      - name: Verify published registry version
        run: npm run registry:verify

      - name: Remove the registry token file
        if: always()
        run: rm -f "$HOME/.config/mcp-publisher/token.json"
