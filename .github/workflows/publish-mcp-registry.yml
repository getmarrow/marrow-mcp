name: Publish MCP Registry Metadata

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@v5

      - name: Verify package is already public
        run: |
          expected="$(node -p "require('./package.json').version")"
          published="$(npm view @getmarrow/mcp version)"
          test "$published" = "$expected"

      - name: Install verified MCP publisher
        env:
          PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz \
            --output /tmp/mcp-publisher.tar.gz
          echo "$PUBLISHER_SHA256  /tmp/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version 2>&1 | grep -F 'mcp-publisher 1.7.9'

      - name: Validate registry metadata
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish registry metadata
        run: ./mcp-publisher publish

      - name: Verify published registry version
        run: npm run registry:verify
